# Outer (hub) tmux config: body pane (nested tmux client) + window-list sidebar.
# No prefix → every key goes to the inner tmux. Switch panes with Alt+←/→ or the mouse.
set -g prefix None
unbind C-b
set -g mouse on
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g focus-events on
set -g escape-time 0
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-b     resize-pane -t 1 -x 34
# Follow the latest client size (never pin the size manually — the rest fills with '·')
set -g window-size latest
set -g aggressive-resize on
