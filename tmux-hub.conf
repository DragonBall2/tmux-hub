# Outer (hub) tmux config: body pane (nested tmux client) + window-list sidebar.
# No prefix → every key goes to the inner tmux. Switch panes with Alt+←/→ or the mouse.
set -g prefix None
unbind C-b
set -g mouse on
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g focus-events on
set -g escape-time 0
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-b     resize-pane -t 1 -x 34
# Follow the latest client size (never pin the size manually — the rest fills with '·')
set -g window-size latest
set -g aggressive-resize on
# Sidebar width by keyboard: Alt+[ shrink / Alt+] grow (4 columns, min 12). Width is remembered per hub name.
# run-shell expands formats: #{session_name} = the hub session the key was pressed in; ## delays the inner format.
bind -n 'M-[' run-shell "w=\$(tmux -L hub display -p -t '#{session_name}:0.1' '##{pane_width}'); n=\$((w-4)); [ \$n -lt 12 ] && n=12; tmux -L hub resize-pane -t '#{session_name}:0.1' -x \$n"
bind -n 'M-]' run-shell "w=\$(tmux -L hub display -p -t '#{session_name}:0.1' '##{pane_width}'); tmux -L hub resize-pane -t '#{session_name}:0.1' -x \$((w+4))"
