# Outer (hub) tmux config: body pane (nested tmux client) + window-list sidebar.
# No prefix → every key goes to the inner tmux. Switch panes with Alt+←/→ or the mouse.
set -g prefix None
unbind C-b
set -g mouse on
set -g status off
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g focus-events on
set -g escape-time 0
bind -n M-Left  select-pane -t :.-
bind -n M-Right select-pane -t :.+
# Follow the latest client size (never pin the size manually — the rest fills with '·')
set -g window-size latest
set -g aggressive-resize on
# Sidebar size by keyboard: Alt+[ smaller / Alt+] larger (4 columns or 2 rows, min 12/4). Remembered per hub name.
# @sidebar_pane / @sidebar_layout are session options set by thub; run-shell expands #{...} in the pressed session.
bind -n 'M-[' run-shell "if [ '#{@sidebar_layout}' = top ]; then h=\$(tmux -L hub display -p -t '#{@sidebar_pane}' '##{pane_height}'); n=\$((h-2)); [ \$n -lt 4 ] && n=4; tmux -L hub resize-pane -t '#{@sidebar_pane}' -y \$n; else w=\$(tmux -L hub display -p -t '#{@sidebar_pane}' '##{pane_width}'); n=\$((w-4)); [ \$n -lt 12 ] && n=12; tmux -L hub resize-pane -t '#{@sidebar_pane}' -x \$n; fi"
bind -n 'M-]' run-shell "if [ '#{@sidebar_layout}' = top ]; then h=\$(tmux -L hub display -p -t '#{@sidebar_pane}' '##{pane_height}'); tmux -L hub resize-pane -t '#{@sidebar_pane}' -y \$((h+2)); else w=\$(tmux -L hub display -p -t '#{@sidebar_pane}' '##{pane_width}'); tmux -L hub resize-pane -t '#{@sidebar_pane}' -x \$((w+4)); fi"
bind -n M-b     run-shell "if [ '#{@sidebar_layout}' = top ]; then tmux -L hub resize-pane -t '#{@sidebar_pane}' -y 9; else tmux -L hub resize-pane -t '#{@sidebar_pane}' -x 34; fi"
